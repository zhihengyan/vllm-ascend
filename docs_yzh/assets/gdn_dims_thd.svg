<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>T、H、D 三个维度的层级关系</title>
  <desc>T 是 token 数即序列长度，H 是 head 数，D 是单个 head 的维数。D 不等于 hidden_size，而是 hidden_size 除以 head 数。本算子中 q 与 k 的 D 固定为 128，v 的 D 为 128 或 256。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
  </style>

  <rect x="0" y="0" width="680" height="260" fill="#1A1A1A"/>

  <text x="105" y="68" font-size="11" fill="#B4B2A9" text-anchor="middle">T 个 token</text>
  <rect x="60" y="84" width="90" height="12" rx="2" fill="#5F5E5A" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="60" y="104" width="90" height="12" rx="2" fill="#5F5E5A" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="60" y="124" width="90" height="12" rx="2" fill="#5F5E5A" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="60" y="144" width="90" height="12" rx="2" fill="#5F5E5A" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="60" y="164" width="90" height="12" rx="2" fill="#5F5E5A" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="105" y="192" font-size="12" font-weight="500" fill="#E8E6E0" text-anchor="middle">T = token 数</text>

  <line x1="158" y1="130" x2="192" y2="130" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="290" y="68" font-size="11" fill="#B4B2A9" text-anchor="middle">1 个 token 的 q / k / v 向量</text>
  <rect x="200" y="113" width="180" height="34" rx="4" fill="#5F5E5A" stroke="#B4B2A9" stroke-width="0.5"/>
  <line x1="222.5" y1="113" x2="222.5" y2="147" stroke="#B4B2A9" stroke-width="0.5"/>
  <line x1="245" y1="113" x2="245" y2="147" stroke="#B4B2A9" stroke-width="0.5"/>
  <line x1="267.5" y1="113" x2="267.5" y2="147" stroke="#B4B2A9" stroke-width="0.5"/>
  <line x1="290" y1="113" x2="290" y2="147" stroke="#B4B2A9" stroke-width="0.5"/>
  <line x1="312.5" y1="113" x2="312.5" y2="147" stroke="#B4B2A9" stroke-width="0.5"/>
  <line x1="335" y1="113" x2="335" y2="147" stroke="#B4B2A9" stroke-width="0.5"/>
  <line x1="357.5" y1="113" x2="357.5" y2="147" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="290" y="192" font-size="12" font-weight="500" fill="#E8E6E0" text-anchor="middle">H = head 数</text>
  <text x="290" y="168" font-size="11" fill="#B4B2A9" text-anchor="middle">整条长度 = H × D</text>

  <line x1="388" y1="130" x2="422" y2="130" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="515" y="68" font-size="11" fill="#85B7EB" text-anchor="middle">其中 1 个 head</text>
  <rect x="430" y="113" width="170" height="34" rx="4" fill="#185FA5" stroke="#85B7EB" stroke-width="0.5"/>
  <line x1="440" y1="113" x2="440" y2="147" stroke="#B5D4F4" stroke-width="0.5"/>
  <line x1="452" y1="113" x2="452" y2="147" stroke="#B5D4F4" stroke-width="0.5"/>
  <line x1="464" y1="113" x2="464" y2="147" stroke="#B5D4F4" stroke-width="0.5"/>
  <line x1="476" y1="113" x2="476" y2="147" stroke="#B5D4F4" stroke-width="0.5"/>
  <line x1="488" y1="113" x2="488" y2="147" stroke="#B5D4F4" stroke-width="0.5"/>
  <line x1="500" y1="113" x2="500" y2="147" stroke="#B5D4F4" stroke-width="0.5"/>
  <line x1="512" y1="113" x2="512" y2="147" stroke="#B5D4F4" stroke-width="0.5"/>
  <line x1="524" y1="113" x2="524" y2="147" stroke="#B5D4F4" stroke-width="0.5"/>
  <line x1="536" y1="113" x2="536" y2="147" stroke="#B5D4F4" stroke-width="0.5"/>
  <line x1="548" y1="113" x2="548" y2="147" stroke="#B5D4F4" stroke-width="0.5"/>
  <line x1="560" y1="113" x2="560" y2="147" stroke="#B5D4F4" stroke-width="0.5"/>
  <line x1="572" y1="113" x2="572" y2="147" stroke="#B5D4F4" stroke-width="0.5"/>
  <line x1="584" y1="113" x2="584" y2="147" stroke="#B5D4F4" stroke-width="0.5"/>
  <text x="515" y="192" font-size="12" font-weight="500" fill="#E8E6E0" text-anchor="middle">D = 每个 head 的维数</text>

  <text x="60" y="218" font-size="12" fill="#B4B2A9">D 不是 hidden_size 本身，而是 hidden_size ÷ head 数。</text>
  <text x="60" y="240" font-size="12" fill="#85B7EB">本算子硬校验：q / k 的 D 固定为 128，v 的 D 是 128 或 256。</text>
</svg>
